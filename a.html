<!DOCTYPE html>
<html lang="id">
<head>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #f1f1f1;
    padding: 40px;
  }

  h1 {
    text-align: center;
    color: #2c3e50;
  }

  form {
    background-color: white;
    max-width: 500px;
    margin: auto;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
  }

  label {
    font-weight: bold;
    display: block;
    margin-top: 15px;
  }

  input[type="text"],
  input[type="email"],
  input[type="tel"],
  select {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    border: 1px solid #ccc;
    border-radius: 5px;
    box-sizing: border-box;
  }

  input[type="checkbox"] {
    margin-top: 15px;
  }

  button {
    margin-top: 20px;
    width: 100%;
    padding: 12px;
    background-color: #3498db;
    color: white;
    border: none;
    font-size: 16px;
    border-radius: 6px;
    cursor: pointer;
  }

  button:hover {
    background-color: #2980b9;
  }
</style>

  <meta charset="UTF-8">
  <title>Formulir Pendaftaran Event</title>
</head>
<body>

  <h1>Pendaftaran Seminar Web Development</h1>

  <form action="#" method="post">

    <label for="nama">Nama Lengkap:</label><br>
    <input type="text" id="nama" name="nama" required><br><br>

    <label for="email">Email:</label><br>
    <input type="email" id="email" name="email" required><br><br>

    <label for="telepon">Nomor HP:</label><br>
    <input type="tel" id="telepon" name="telepon" required><br><br>

    <label for="jenis">Jenis Acara:</label><br>
    <select id="jenis" name="jenis" required>
      <option value="">-- Pilih Acara --</option>
      <option value="seminar">Seminar</option>
      <option value="workshop">Workshop</option>
      <option value="webinar">Webinar</option>
    </select><br><br>

    <label>
      <input type="checkbox" name="setuju" required>
      Saya menyetujui syarat dan ketentuan
    </label><br><br>

    <button type="submit">Daftar Sekarang</button>

  </form>

</body>
</html>
